# Description: PPP PRIVATE NETWORK(TM) 2 – Linux cross-compilation builds.
#              All third-party libraries (Boost/OpenSSL/jemalloc/libunwind)
#              are source-built for the target architecture — no prebuilt
#              3rd-party environment clone (liulilittle/openppp2-ubuntu-3rd-environment).
# Author     : OpenCode.
# Date-Time  : 2026/05/03

name: Build · Linux Cross

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-linux-cross-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: "1.92.0"
  OPENSSL_VERSION: "4.1.0"
  JEMALLOC_VERSION: "5.4.0"
  LIBUNWIND_VERSION: "1.8.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux ${{ matrix.third_dir }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"platform":"linux/aarch64","cc":"aarch64-linux-gnu-gcc","cxx":"aarch64-linux-gnu-g++","apt_pkg":"aarch64-linux-gnu","debian_arch":"arm64","third_dir":"aarch64","tool_prefix":"aarch64-linux-gnu-","archiver":"aarch64-linux-gnu-ar","ranlib":"aarch64-linux-gnu-ranlib","boost_arch":"arm","boost_model":"64","boost_abi":"aapcs","openssl_target":"linux-aarch64","readelf_hint":"AArch64","boost_extra":""}]}' || '{"include":[{"platform":"linux/aarch64","cc":"aarch64-linux-gnu-gcc","cxx":"aarch64-linux-gnu-g++","apt_pkg":"aarch64-linux-gnu","debian_arch":"arm64","third_dir":"aarch64","tool_prefix":"aarch64-linux-gnu-","archiver":"aarch64-linux-gnu-ar","ranlib":"aarch64-linux-gnu-ranlib","boost_arch":"arm","boost_model":"64","boost_abi":"aapcs","openssl_target":"linux-aarch64","readelf_hint":"AArch64","boost_extra":""}]}') }}

    steps:
      - uses: actions/checkout@v6

      - name: Install cross-compiler and build tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip curl wget \
            autoconf automake libtool \
            gcc-${{ matrix.apt_pkg }} g++-${{ matrix.apt_pkg }} \
            binutils-${{ matrix.apt_pkg }}

      # Caches the built archives only. The Boost and OpenSSL source trees plus
      # the .o files `make` leaves behind used to make this a ~1 GB entry for a
      # single architecture, which is more than this repository's entire Android
      # cache budget. Changing what is cached means bumping one of the version
      # variables above -- actions/cache never overwrites an existing key.
      # One cache entry per dependency, so bumping one version leaves the other
      # three alone instead of rebuilding all of them from source. Keys are
      # exact-match only on purpose: a restore-keys prefix hit restores the tree
      # but still reports cache-hit=false, so the build step reruns on top of
      # what was just restored.
      - name: Cache Boost (source-built)
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/boost
          key: linux-${{ matrix.third_dir }}-boost${{ env.BOOST_VERSION }}

      - name: Cache OpenSSL (source-built)
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/openssl
          key: linux-${{ matrix.third_dir }}-openssl${{ env.OPENSSL_VERSION }}

      - name: Cache jemalloc (source-built)
        id: cache-jemalloc
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/jemalloc
          key: linux-${{ matrix.third_dir }}-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Cache libunwind (source-built)
        id: cache-libunwind
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/libunwind
          key: linux-${{ matrix.third_dir }}-libunwind${{ env.LIBUNWIND_VERSION }}

      - name: Build Boost (cross-compiled)
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          boost_version_underscore="${BOOST_VERSION//./_}"
          boost_root="$GITHUB_WORKSPACE/third-party/boost"
          archive="$RUNNER_TEMP/boost_${boost_version_underscore}.tar.bz2"
          mkdir -p "$GITHUB_WORKSPACE/third-party"
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${boost_version_underscore}.tar.bz2" -O "$archive"
          rm -rf "$boost_root" "$RUNNER_TEMP/boost_${boost_version_underscore}"
          tar jxf "$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/boost_${boost_version_underscore}" "$boost_root"

          user_config="$RUNNER_TEMP/boost-user-config.jam"
          cat > "$user_config" <<'EOF'
          using gcc : ${{ matrix.third_dir }} : ${{ matrix.cxx }} :
              <archiver>${{ matrix.archiver }}
              <ranlib>${{ matrix.ranlib }}
          ;
          EOF

          cd "$boost_root"
          ./bootstrap.sh
          ./b2 -j"$(nproc)" \
            --user-config="$user_config" \
            --layout=system \
            toolset=gcc-${{ matrix.third_dir }} \
            target-os=linux \
            binary-format=elf \
            architecture=${{ matrix.boost_arch }} \
            address-model=${{ matrix.boost_model }} \
            abi=${{ matrix.boost_abi }} \
            context-impl=fcontext \
            compileflags="-fPIC ${{ matrix.boost_extra }}" \
            link=static \
            runtime-link=static \
            threading=multi \
            variant=release \
            --with-system --with-coroutine --with-thread --with-context --with-regex --with-filesystem \
            stage
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          # Must use cross-toolchain to produce target-compatible object format
          touch /tmp/empty.c && ${{ matrix.tool_prefix }}gcc -c /tmp/empty.c -o /tmp/empty.o && ${{ matrix.tool_prefix }}ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o

      - name: Build OpenSSL (cross-compiled)
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          openssl_root="$GITHUB_WORKSPACE/third-party/openssl"
          archive="$RUNNER_TEMP/openssl-${OPENSSL_VERSION}.tar.gz"
          mkdir -p "$GITHUB_WORKSPACE/third-party"
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" -O "$archive"
          rm -rf "$openssl_root" "$RUNNER_TEMP/openssl-${OPENSSL_VERSION}"
          tar zxf "$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/openssl-${OPENSSL_VERSION}" "$openssl_root"
          cd "$openssl_root"
          ./Configure ${{ matrix.openssl_target }} --cross-compile-prefix=${{ matrix.tool_prefix }} no-shared
          make -j"$(nproc)"

      - name: Build jemalloc (cross-compiled)
        if: steps.cache-jemalloc.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          jemalloc_root="$GITHUB_WORKSPACE/third-party/jemalloc"
          archive="$RUNNER_TEMP/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          mkdir -p "$GITHUB_WORKSPACE/third-party"
          wget -q "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2" -O "$archive"
          rm -rf "$jemalloc_root" "$RUNNER_TEMP/jemalloc-${JEMALLOC_VERSION}"
          tar jxf "$archive" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/jemalloc-${JEMALLOC_VERSION}" "$jemalloc_root"
          cd "$jemalloc_root"
          ./autogen.sh --host=${{ matrix.apt_pkg }} --with-jemalloc-prefix=je_
          make -j"$(nproc)"

      - name: Build libunwind (cross-compiled)
        if: steps.cache-libunwind.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "$RUNNER_TEMP"
          wget -q "https://github.com/libunwind/libunwind/releases/download/v${LIBUNWIND_VERSION}/libunwind-${LIBUNWIND_VERSION}.tar.gz"
          tar xf "libunwind-${LIBUNWIND_VERSION}.tar.gz"
          cd "libunwind-${LIBUNWIND_VERSION}"
          ./configure --host=${{ matrix.apt_pkg }} \
            --prefix=${{ github.workspace }}/third-party/libunwind \
            --disable-shared --enable-static
          make -j"$(nproc)"
          make install

      - name: Verify cross-compiled libraries
        run: |
          set -euxo pipefail
          TP="${{ github.workspace }}/third-party"
          grep -Eq "^#define BOOST_VERSION 109200$" "$TP/boost/boost/version.hpp"
          test -f "$TP/openssl/libssl.a"
          test -f "$TP/openssl/libcrypto.a"
          test -f "$TP/jemalloc/lib/libjemalloc.a"
          test -f "$TP/libunwind/lib/libunwind.a"
          for lib in system coroutine thread context regex filesystem; do
            test -s "$TP/boost/stage/lib/libboost_${lib}.a"
          done
          # Machine check via readelf on one object from each static archive
          for a in "openssl/libcrypto.a" "jemalloc/lib/libjemalloc.a" "boost/stage/lib/libboost_context.a"; do
            obj="$(${{ matrix.tool_prefix }}ar t "$TP/$a" | head -1)"
            d="$(mktemp -d)"
            (cd "$d" && ${{ matrix.tool_prefix }}ar x "$TP/$a" "$obj")
            ${{ matrix.tool_prefix }}readelf -h "$d/$obj" | grep -q "Machine:.*${{ matrix.readelf_hint }}"
            rm -rf "$d"
          done

      # Trim the tree down to the headers and archives the link step reads. The
      # Boost/OpenSSL source trees plus the .o files `make` scatters through
      # them are worth ~850 MB here and are refetched in seconds when missing.
      # This runs on cache hits too, where every build step above was skipped,
      # so each removal has to stay a no-op when the path is already gone.
      - name: Trim re-downloadable sources before caching
        run: |
          set -euo pipefail
          TP="${{ github.workspace }}/third-party"
          # Keep boost/boost (the include root CMake points at) and boost/stage.
          rm -rf "$TP/boost/libs" "$TP/boost/doc" "$TP/boost/tools" \
                 "$TP/boost/status" "$TP/boost/bin.v2"
          # Keep include/ and the two archives; include/openssl/*.h are symlinks
          # into ../crypto and ../ssl, so those .h files must survive -- which
          # is why only the .o files go.
          rm -rf "$TP/openssl/fuzz" "$TP/openssl/test" "$TP/openssl/openssl"
          find "$TP/openssl" "$TP/jemalloc" -name '*.o' -delete
          rm -rf "$TP/jemalloc/autom4te.cache"
          # libunwind is only ever consumed through -L.../libunwind/lib.
          find "$TP/libunwind" -mindepth 1 -maxdepth 1 \
            ! -name lib ! -name include -exec rm -rf {} +

      - name: Compute version label
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Prepare pinned XTCP source
        run: bash tools/prepare_xtcp.sh

      - name: Build openppp2
        run: |
          TP="${{ github.workspace }}/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR="$TARGET_PROCESSOR" \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_EXE_LINKER_FLAGS="-L${{ github.workspace }}/third-party/libunwind/lib" \
            -DCMAKE_CXX_FLAGS="-DOPENSSL_API_COMPAT=0x10100000L" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}" \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DENABLE_XTCP=ON
          make -j$(nproc)

      - name: Package artifact
        run: |
          PLATFORM_SAFE="${{ matrix.platform }}"
          PLATFORM_SAFE="${PLATFORM_SAFE//\//-}"
          ARTIFACT="openppp2-${PLATFORM_SAFE}.zip"
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin && zip -r "$ARTIFACT" ppp

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error
