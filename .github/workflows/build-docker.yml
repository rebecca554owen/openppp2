name: Build · Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（如 v1.0.0），必填'
        required: true
      arch:
        description: '发布架构：amd64（默认）或 all（amd64+arm64）'
        required: false
        default: 'amd64'
        type: choice
        options:
          - amd64
          - all
concurrency:
  group: build-openppp2-docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openppp2

jobs:
  prep:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-platforms.outputs.matrix }}
    steps:
      - name: Determine platforms
        id: set-platforms
        run: |
          if [ "${{ github.event.inputs.arch }}" = "all" ]; then
            echo 'matrix=[{"platform":"linux/amd64","platform_name":"linux-amd64"},{"platform":"linux/arm64","platform_name":"linux-arm64"}]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=[{"platform":"linux/amd64","platform_name":"linux-amd64"}]' >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-24.04
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prep.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU for multi-platform builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get tag
        id: get-tag
        run: |
          echo "tag=${{ inputs.tag || github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Validate Docker tag
        run: |
          tag="${{ steps.get-tag.outputs.tag }}"
          if [[ "$tag" != "latest" && ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "错误：标签格式无效，应为v*.*.*或latest"
            exit 1
          fi

      - name: Release timestamp
        id: rel-ts
        run: echo "ts=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Build and push platform-specific images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./ppp.Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.get-tag.outputs.tag }}
            RELEASE_TS=${{ steps.rel-ts.outputs.ts }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-tag.outputs.tag }}

      - name: Save digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          DIGEST=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get-tag.outputs.tag }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo $DIGEST > /tmp/digests/${{ matrix.platform_name }}

      - name: Upload digests
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_name }}
          path: /tmp/digests
          retention-days: 1

  merge:
    if: github.event.inputs.arch == 'all'
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create multi-arch manifest and push
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || github.ref_name }} \
            $(cat /tmp/digests/*)

      - name: Verify multi-arch image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag || github.ref_name }}
