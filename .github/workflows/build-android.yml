name: Build · Android

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_API: "21"
  BOOST_VERSION: "1.86.0"
  OPENSSL_VERSION: "4.0.2"
  NDK_VERSION: "r29"
  CACHE_VERSION: "v2.2.0"

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            ppp_abi: aarch64
            clang_triple: aarch64-linux-android
            boost_toolset: androidarm64
            boost_arch: arm
            boost_address_model: "64"
            boost_abi: aapcs
            openssl_suffix: arm64
            openssl_target: android-arm64
    env:
      ANDROID_ABI: ${{ matrix.abi }}
      PPP_ANDROID_ABI: ${{ matrix.ppp_abi }}
      CLANG_TRIPLE: ${{ matrix.clang_triple }}
      BOOST_TOOLSET_SUFFIX: ${{ matrix.boost_toolset }}
      BOOST_ARCHITECTURE: ${{ matrix.boost_arch }}
      BOOST_ADDRESS_MODEL: ${{ matrix.boost_address_model }}
      BOOST_ABI: ${{ matrix.boost_abi }}
      OPENSSL_SUFFIX: ${{ matrix.openssl_suffix }}
      OPENSSL_TARGET: ${{ matrix.openssl_target }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache NDK and dependencies
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/ndk
            ${{ runner.temp }}/third-party
          key: android-${{ matrix.abi }}-ndk${{ env.NDK_VERSION }}-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-ubuntu-${{ env.CACHE_VERSION }}
          restore-keys: |
            android-${{ matrix.abi }}-ndk${{ env.NDK_VERSION }}-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-ubuntu-

      - name: Download NDK ${{ env.NDK_VERSION }}
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/ndk" && cd "${{ runner.temp }}/ndk"
          curl --http1.1 -L --fail --retry 5 --retry-all-errors --retry-delay 10 \
            -o android-ndk-${{ env.NDK_VERSION }}-linux.zip \
            https://dl.google.com/android/repository/android-ndk-${{ env.NDK_VERSION }}-linux.zip
          unzip -q android-ndk-${{ env.NDK_VERSION }}-linux.zip
          rm android-ndk-${{ env.NDK_VERSION }}-linux.zip
          mv android-ndk-${{ env.NDK_VERSION }} abi

      - name: Prepare build variables
        run: |
          set -euo pipefail
          NDK_ROOT="${{ runner.temp }}/ndk/abi"
          TOOLCHAIN_DIR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          TP="${{ runner.temp }}/third-party"
          test -f "$NDK_ROOT/build/cmake/android.toolchain.cmake"
          test -f "$TOOLCHAIN_DIR/bin/${CLANG_TRIPLE}${ANDROID_API}-clang++"

          mkdir -p "$TP/boost" "$TP/openssl"

          {
            echo "NDK_ROOT=$NDK_ROOT"
            echo "TOOLCHAIN_DIR=$TOOLCHAIN_DIR"
            echo "TP=$TP"
            echo "BOOST_SRC_DIR=$TP/boost-src"
            echo "BOOST_OUT_DIR=$TP/boost/$PPP_ANDROID_ABI"
            echo "OPENSSL_SRC_DIR=$TP/openssl-src"
            echo "OPENSSL_OUT_DIR=$TP/openssl/$PPP_ANDROID_ABI"
          } >> "$GITHUB_ENV"

      - name: Build OpenSSL for Android ${{ matrix.abi }}
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$TP/openssl-${OPENSSL_VERSION}.tar.gz"
          extract="$TP/openssl-${OPENSSL_VERSION}"

          if [ ! -f "$OPENSSL_SRC_DIR/Configure" ]; then
            curl -L --fail -o "$archive" \
              "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
            rm -rf "$extract" "$OPENSSL_SRC_DIR"
            tar -xzf "$archive" -C "$TP"
            mv "$extract" "$OPENSSL_SRC_DIR"
          fi

          rm -rf "$OPENSSL_OUT_DIR"
          mkdir -p "$OPENSSL_OUT_DIR"

          cd "$OPENSSL_SRC_DIR"
          export ANDROID_NDK_HOME="$NDK_ROOT"
          export ANDROID_NDK_ROOT="$NDK_ROOT"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CFLAGS="-fPIC"
          export CXXFLAGS="-fPIC"

          make clean >/dev/null 2>&1 || true
          ./Configure "$OPENSSL_TARGET" -D__ANDROID_API__="$ANDROID_API" \
            --prefix="$OPENSSL_OUT_DIR" \
            no-shared no-tests no-module no-asm
          make -j"$(nproc)"
          make install_sw

      - name: Build Boost for Android ${{ matrix.abi }}
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          boost_lib_version="$(printf '%s' "$BOOST_VERSION" | sed 's/\./_/g')"
          archive="$TP/boost_${boost_lib_version}.tar.bz2"
          extract="$TP/boost_${boost_lib_version}"

          if [ ! -f "$BOOST_SRC_DIR/boost/version.hpp" ] || \
            ! grep -q "BOOST_LIB_VERSION \"$boost_lib_version\"" "$BOOST_SRC_DIR/boost/version.hpp"; then
            curl -L --fail -o "$archive" \
              "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${boost_lib_version}.tar.bz2"
            rm -rf "$extract" "$BOOST_SRC_DIR"
            tar -xjf "$archive" -C "$TP"
            mv "$extract" "$BOOST_SRC_DIR"
          fi

          rm -rf "$BOOST_OUT_DIR"
          mkdir -p "$BOOST_OUT_DIR"

          user_config="$(mktemp)"
          cat > "$user_config" <<EOF
          using clang : $BOOST_TOOLSET_SUFFIX : $TOOLCHAIN_DIR/bin/${CLANG_TRIPLE}${ANDROID_API}-clang++ :
              <archiver>$TOOLCHAIN_DIR/bin/llvm-ar
              <ranlib>$TOOLCHAIN_DIR/bin/llvm-ranlib
              <compileflags>--target=${CLANG_TRIPLE}${ANDROID_API}
              <compileflags>--sysroot=$TOOLCHAIN_DIR/sysroot
              <compileflags>-fPIC
              <compileflags>-std=c++17
              <compileflags>-D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION
              <linkflags>--target=${CLANG_TRIPLE}${ANDROID_API}
              <linkflags>--sysroot=$TOOLCHAIN_DIR/sysroot
          ;
          EOF

          cd "$BOOST_SRC_DIR"
          if [ ! -x ./b2 ]; then
            ./bootstrap.sh --with-toolset=clang
          fi

          ./b2 -j"$(nproc)" \
            --user-config="$user_config" \
            --build-dir="$BOOST_OUT_DIR/build" \
            toolset=clang-$BOOST_TOOLSET_SUFFIX \
            target-os=android \
            binary-format=elf \
            architecture=$BOOST_ARCHITECTURE \
            address-model=$BOOST_ADDRESS_MODEL \
            abi=$BOOST_ABI \
            context-impl=fcontext \
            link=static \
            threading=multi \
            runtime-link=static \
            variant=release \
            --with-system \
            --with-coroutine \
            --with-thread \
            --with-context \
            --with-regex \
            --with-filesystem \
            --stagedir="$BOOST_OUT_DIR/stage" \
            stage

          rm -f "$user_config"
          find "$BOOST_OUT_DIR/stage/lib" -type f -name 'libboost_*.a' -exec cp {} "$BOOST_OUT_DIR/" \;

          for lib in system coroutine thread context regex filesystem; do
            test -f "$BOOST_OUT_DIR/libboost_${lib}.a"
          done

      - name: Verify Android third-party dependencies
        run: |
          set -euo pipefail
          test -f "$OPENSSL_OUT_DIR/lib/libssl.a"
          test -f "$OPENSSL_OUT_DIR/lib/libcrypto.a"
          test -d "$OPENSSL_OUT_DIR/include/openssl"
          test -f "$BOOST_SRC_DIR/boost/version.hpp"
          for lib in system coroutine thread context regex filesystem; do
            test -f "$BOOST_OUT_DIR/libboost_${lib}.a"
          done

      - name: Compute version label
        id: ver
        run: |
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2
        run: |
          set -euo pipefail
          export PPP_ANDROID_ABI
          build_dir="$GITHUB_WORKSPACE/build/android-actions/${{ matrix.abi }}"
          output_dir="$GITHUB_WORKSPACE/bin/android/${{ matrix.abi }}"
          rm -rf "$build_dir"
          mkdir -p "$build_dir" "$output_dir"

          cd "$build_dir"
          cmake "$GITHUB_WORKSPACE/android" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DCMAKE_SYSTEM_NAME=Android \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NATIVE_API_LEVEL=$ANDROID_API \
            -DANDROID_STL=c++_static \
            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$output_dir" \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DBOOST_ANDROID_INCLUDE_DIR="$BOOST_SRC_DIR" \
            -DBOOST_ANDROID_LIB_DIR="$BOOST_OUT_DIR" \
            -DOPENSSL_ANDROID_ROOT="$OPENSSL_OUT_DIR" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}"
          make -j"$(nproc)"

      - name: Package artifact
        run: |
          ARTIFACT=openppp2-android-${{ matrix.abi }}.zip
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin/android/${{ matrix.abi }}
          zip -r "$ARTIFACT" libopenppp2.so
          mv "$ARTIFACT" ../../

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error
  build-apk:
    name: Build Flutter APK
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Download all .so artifacts
        uses: actions/download-artifact@v8
        with:
          path: so-artifacts
          pattern: openppp2-android-*.zip

      - name: Extract .so into jniLibs
        run: |
          set -euo pipefail
          # download-artifact may land artifacts as flat files
          # (so-artifacts/<name>.zip) or per-artifact directories;
          # match any depth.
          zips=$(find so-artifacts -type f -name 'openppp2-android-*.zip' | sort)
          if [ -z "$zips" ]; then
            echo "no openppp2-android-*.zip found under so-artifacts:" >&2
            find so-artifacts -maxdepth 3 >&2 || true
            exit 1
          fi
          echo "$zips" | while IFS= read -r zip; do
            abi=$(basename "$zip" | sed 's/openppp2-android-//;s/\.zip//')
            mkdir -p "android/android/app/src/main/jniLibs/${abi}"
            unzip -o "$zip" -d "android/android/app/src/main/jniLibs/${abi}"
          done
          echo "=== jniLibs tree ==="
          find android/android/app/src/main/jniLibs -type f

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.5'
          cache: true

      - name: Flutter doctor & pub get
        run: |
          flutter doctor -v
          cd android && flutter pub get

      - name: Configure Android release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # A fork does not inherit the signing secrets. Report that and skip
          # the release build rather than failing the Android workflow, which
          # would mask the build and instrumentation results in the same run.
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::notice::Release signing secret ${name} is not set; skipping the signed APK."
              echo "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          mkdir -p android/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android/keystore/yav-release-key.p12
          {
            echo "storeFile=keystore/yav-release-key.p12"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD}"
            echo "keyAlias=${ANDROID_KEY_ALIAS}"
            echo "keyPassword=${ANDROID_KEY_PASSWORD}"
          } > android/android/keystore/yav-release-key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          cd android
          flutter build apk --release

      - name: Verify signed APK
        if: steps.signing.outputs.signed == 'true'
        run: |
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools | sort -V | tail -n 1)/apksigner verify \
            --verbose --print-certs android/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload signed APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: openppp2-android.apk
          path: android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
