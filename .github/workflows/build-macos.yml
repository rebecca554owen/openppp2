# Description: PPP PRIVATE NETWORK(TM) 2 – macOS builds (arm64 & x86_64).
# Author     : OpenCode.
# Date-Time  : 2026-05-03

name: Build · macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: "1.92.0"
  OPENSSL_VERSION: "4.0.2"
  JEMALLOC_VERSION: "5.3.1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool

      - name: Set architecture
        id: arch
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "flags=-arch arm64" >> $GITHUB_OUTPUT
            echo "b2_props=architecture=arm address-model=64 abi=aapcs" >> $GITHUB_OUTPUT
          else
            echo "flags=-arch x86_64" >> $GITHUB_OUTPUT
            echo "b2_props=architecture=x86 address-model=64 abi=sysv" >> $GITHUB_OUTPUT
          fi

      - name: Cache third-party libraries
        id: cache-third
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party
          key: macos-${{ matrix.arch }}-deps-v2-boost${{ env.BOOST_VERSION }}-openssl${{ env.OPENSSL_VERSION }}-jemalloc${{ env.JEMALLOC_VERSION }}
          restore-keys: |
            macos-${{ matrix.arch }}-deps-v2-

      - name: Build Boost
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          curl -L -o boost.tar.bz2 "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar -xjf boost.tar.bz2 && rm -rf boost boost.tar.bz2
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags="-fPIC ${{ steps.arch.outputs.flags }}" linkflags="${{ steps.arch.outputs.flags }}" ${{ steps.arch.outputs.b2_props }} --with-system --with-context --with-coroutine --with-thread --with-filesystem --with-regex --stagedir=stage -j$(sysctl -n hw.logicalcpu)
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          touch /tmp/empty.c && cc -c /tmp/empty.c -o /tmp/empty.o && ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o
          cd ../..

      - name: Build jemalloc
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          cd third-party
          curl -L -o jemalloc.tar.bz2 "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar -xjf jemalloc.tar.bz2 && rm -rf jemalloc jemalloc.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc
          CFLAGS="${{ steps.arch.outputs.flags }}" LDFLAGS="${{ steps.arch.outputs.flags }}" \
            ./autogen.sh --with-jemalloc-prefix=je_ --disable-shared --enable-static
          make -j$(sysctl -n hw.logicalcpu)
          cd ../..

      - name: Build OpenSSL
        if: steps.cache-third.outputs.cache-hit != 'true'
        run: |
          cd third-party
          curl -L -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf openssl.tar.gz && rm -rf openssl openssl-src openssl.tar.gz
          mv openssl-* openssl-src
          cd openssl-src
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            OPENSSL_CONF="darwin64-arm64-cc"
          else
            OPENSSL_CONF="darwin64-x86_64-cc"
          fi
          CC=/usr/bin/clang RANLIB=/usr/bin/ranlib AR=/usr/bin/ar \
            ./Configure ${OPENSSL_CONF} \
            --prefix="$PWD/../openssl" \
            no-shared no-tests
          make -j$(sysctl -n hw.logicalcpu) RANLIB=/usr/bin/ranlib AR=/usr/bin/ar
          make install_sw RANLIB=/usr/bin/ranlib AR=/usr/bin/ar
          cd ..
          ln -sf lib/libssl.a openssl/libssl.a
          ln -sf lib/libcrypto.a openssl/libcrypto.a
          cd ../..

      - name: Compute version label
        id: ver
        run: |
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTHIRD_PARTY_LIBRARY_DIR="${{ github.workspace }}/third-party" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}"
          make -j$(sysctl -n hw.physicalcpu)

      - name: Package artifact
        run: |
          ARTIFACT=openppp2-darwin-${{ matrix.arch }}.zip
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin && zip -r "$ARTIFACT" ppp

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error
