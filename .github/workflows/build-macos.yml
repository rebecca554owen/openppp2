# Description: PPP PRIVATE NETWORK(TM) 2 – macOS builds (arm64 & x86_64).
# Author     : OpenCode.
# Date-Time  : 2026-05-03

name: Build · macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: "1.92.0"
  OPENSSL_VERSION: "4.1.0"
  JEMALLOC_VERSION: "5.4.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool

      - name: Set architecture
        id: arch
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "flags=-arch arm64" >> $GITHUB_OUTPUT
            echo "b2_props=architecture=arm address-model=64 abi=aapcs" >> $GITHUB_OUTPUT
          else
            echo "flags=-arch x86_64" >> $GITHUB_OUTPUT
            echo "b2_props=architecture=x86 address-model=64 abi=sysv" >> $GITHUB_OUTPUT
          fi

      # Built artifacts only. The Boost and OpenSSL source trees were ~230 MB of
      # this entry's ~280 MB, and `make` never needs them again once the archives
      # exist -- any miss just refetches them in seconds. Changing what is cached
      # means bumping one of the version variables above; actions/cache never
      # overwrites an existing key.
      # One cache entry per dependency, so bumping one version leaves the other
      # two alone instead of rebuilding all three from source. Keys are
      # exact-match only on purpose: a restore-keys prefix hit restores the tree
      # but still reports cache-hit=false, so the build step reruns on top of
      # what was just restored.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/boost
          key: macos-${{ matrix.arch }}-boost${{ env.BOOST_VERSION }}

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/openssl
          key: macos-${{ matrix.arch }}-openssl${{ env.OPENSSL_VERSION }}

      - name: Cache jemalloc
        id: cache-jemalloc
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/jemalloc
          key: macos-${{ matrix.arch }}-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          curl -L -o boost.tar.bz2 "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar -xjf boost.tar.bz2 && rm -rf boost boost.tar.bz2
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags="-fPIC ${{ steps.arch.outputs.flags }}" linkflags="${{ steps.arch.outputs.flags }}" ${{ steps.arch.outputs.b2_props }} --with-system --with-context --with-coroutine --with-thread --with-filesystem --with-regex --stagedir=stage -j$(sysctl -n hw.logicalcpu)
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          touch /tmp/empty.c && cc -c /tmp/empty.c -o /tmp/empty.o && ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o
          cd ../..

      - name: Build jemalloc
        if: steps.cache-jemalloc.outputs.cache-hit != 'true'
        run: |
          cd third-party
          curl -L -o jemalloc.tar.bz2 "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar -xjf jemalloc.tar.bz2 && rm -rf jemalloc jemalloc.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc
          CFLAGS="${{ steps.arch.outputs.flags }}" LDFLAGS="${{ steps.arch.outputs.flags }}" \
            ./autogen.sh --with-jemalloc-prefix=je_ --disable-shared --enable-static
          make -j$(sysctl -n hw.logicalcpu)
          cd ../..

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          cd third-party
          curl -L -o openssl.tar.gz "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz"
          tar -xzf openssl.tar.gz && rm -rf openssl openssl-src openssl.tar.gz
          mv openssl-* openssl-src
          cd openssl-src
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            OPENSSL_CONF="darwin64-arm64-cc"
          else
            OPENSSL_CONF="darwin64-x86_64-cc"
          fi
          CC=/usr/bin/clang RANLIB=/usr/bin/ranlib AR=/usr/bin/ar \
            ./Configure ${OPENSSL_CONF} \
            --prefix="$PWD/../openssl" \
            no-shared no-tests
          make -j$(sysctl -n hw.logicalcpu) RANLIB=/usr/bin/ranlib AR=/usr/bin/ar
          make install_sw RANLIB=/usr/bin/ranlib AR=/usr/bin/ar
          cd ..
          ln -sf lib/libssl.a openssl/libssl.a
          ln -sf lib/libcrypto.a openssl/libcrypto.a
          cd ../..

      # Trim the tree down to what the link step reads. OpenSSL is consumed
      # through third-party/openssl (include/ plus lib/ from `make install_sw`),
      # so its entire build tree is disposable here. Runs on cache hits too,
      # where every build step above was skipped, so each removal must stay a
      # no-op when the path is already gone.
      - name: Trim re-downloadable sources before caching
        run: |
          set -euo pipefail
          TP="${{ github.workspace }}/third-party"
          # Keep boost/boost (the include root CMake points at) and boost/stage.
          rm -rf "$TP/boost/libs" "$TP/boost/doc" "$TP/boost/tools" \
                 "$TP/boost/status" "$TP/boost/bin.v2"
          rm -rf "$TP/openssl-src"
          # Keep jemalloc/include and jemalloc/lib; drop the .o files.
          find "$TP/jemalloc" -name '*.o' -delete
          rm -rf "$TP/jemalloc/autom4te.cache"

      - name: Compute version label
        id: ver
        run: |
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DTHIRD_PARTY_LIBRARY_DIR="${{ github.workspace }}/third-party" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}"
          make -j$(sysctl -n hw.physicalcpu)

      - name: Package artifact
        run: |
          ARTIFACT=openppp2-darwin-${{ matrix.arch }}.zip
          echo "ARTIFACT=$ARTIFACT" >> $GITHUB_ENV
          cd bin && zip -r "$ARTIFACT" ppp

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT }}
          path: bin/${{ env.ARTIFACT }}
          if-no-files-found: error
