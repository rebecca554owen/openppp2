name: Build · Base Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'base.Dockerfile'
      - 'entrypoint.sh'
      - '.github/workflows/build-base.yml'
    branches:
      - dev

concurrency:
  group: build-openppp2-base-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/openppp2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base image carries the runtime libraries for every release image
      # (ppp.Dockerfile copies only the binary into it). It has to be built on
      # the same distribution the release binaries are compiled on, otherwise
      # the container fails to start on the newer glibc/libstdc++ symbols the
      # binary references.
      - name: Build and push the base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./base.Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base

      - name: Verify the base image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:base
