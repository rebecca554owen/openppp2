# Author     : OpenCode.
# Date-Time  : 2026/05/03

name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      title:
        description: 'Release title'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Resolve release revision
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
            echo "::error::Invalid release tag: ${RELEASE_TAG}"
            exit 1
          fi

          tag_sha=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          echo "tag_sha=${tag_sha}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${RELEASE_TAG} at ${tag_sha}"

      - name: Download artifacts built from release revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release.outputs.tag_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts

          workflows=(
            "build-android.yml"
            "build-linux-amd64.yml"
            "build-linux-cross.yml"
            "build-macos.yml"
            "build-windows-x64.yml"
            "build-windows-arm64.yml"
            "build-go-guardian.yml"
          )

          for workflow in "${workflows[@]}"; do
            echo "Locating successful $workflow run for ${RELEASE_SHA}..."
            run_id=$(gh run list \
              --workflow="$workflow" \
              --commit="$RELEASE_SHA" \
              --status=success \
              --limit=1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -z "$run_id" ]; then
              echo "::error::No successful $workflow run found for ${RELEASE_SHA}"
              exit 1
            fi

            run_sha=$(gh run view "$run_id" --json headSha --jq '.headSha')
            if [ "$run_sha" != "$RELEASE_SHA" ]; then
              echo "::error::$workflow run $run_id belongs to $run_sha, expected ${RELEASE_SHA}"
              exit 1
            fi

            artifact_dir="artifacts/${workflow%.yml}"
            mkdir -p "$artifact_dir"
            gh run download "$run_id" --dir "$artifact_dir"
          done

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          workflows=(
            "build-android.yml"
            "build-linux-amd64.yml"
            "build-linux-cross.yml"
            "build-macos.yml"
            "build-windows-x64.yml"
            "build-windows-arm64.yml"
            "build-go-guardian.yml"
          )

          # Require at least one non-empty archive from every expected workflow
          # so a half-built matrix cannot silently produce a partial release.
          for workflow in "${workflows[@]}"; do
            artifact_dir="artifacts/${workflow%.yml}"
            count=$(find "$artifact_dir" -type f -size +0c \
              \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) | wc -l)
            if [ "$count" -eq 0 ]; then
              echo "::error::No non-empty release asset from $workflow (dir: $artifact_dir)"
              exit 1
            fi
            find "$artifact_dir" -type f -size +0c \
              \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.apk' \) \
              -exec cp {} release-assets/ \;
          done

          echo "Release assets:"
          find release-assets -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ steps.release.outputs.tag_sha }}
          name: ${{ inputs.title }}
          prerelease: ${{ inputs.prerelease }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
