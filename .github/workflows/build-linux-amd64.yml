# Description: PPP PRIVATE NETWORK(TM) 2 – Linux amd64 native build with feature matrix.
# Author     : OpenCode.
# Date-Time  : 2026/05/03

name: Build · Linux amd64

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, codex/runtime-ui-lifecycle-integration]
  workflow_dispatch:

concurrency:
  group: build-linux-amd64-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # 1.87 and later dropped the error_code overloads of basic_socket and
  # basic_waitable_timer (cancel(), close() and shutdown() now only come in
  # throwing forms), and this tree still calls them, so a newer Boost does not
  # compile here.  Bumping these means porting the socket calls first.
  # The tree compiles against these versions: Boost 1.92 dropped the
  # error_code overloads of basic_waitable_timer, and ppp/net/AsioCompat.h
  # bridges that difference.  OpenSSL 4.1 and jemalloc 5.4 still carry every
  # API the tree uses.
  BOOST_VERSION: "1.92.0"
  OPENSSL_VERSION: "4.1.0"
  JEMALLOC_VERSION: "5.4.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Linux amd64 ${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"suffix":"","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-tc-io-uring-simd","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"ON"}]}' || '{"include":[{"suffix":"","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-io-uring","enable_sysnat":"OFF","enable_io_uring":"ON","enable_simd":"OFF"},{"suffix":"-simd","enable_sysnat":"OFF","enable_io_uring":"OFF","enable_simd":"ON"},{"suffix":"-tc","enable_sysnat":"ON","enable_io_uring":"OFF","enable_simd":"OFF"},{"suffix":"-tc-io-uring","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"OFF"},{"suffix":"-tc-simd","enable_sysnat":"ON","enable_io_uring":"OFF","enable_simd":"ON"},{"suffix":"-io-uring-simd","enable_sysnat":"OFF","enable_io_uring":"ON","enable_simd":"ON"},{"suffix":"-tc-io-uring-simd","enable_sysnat":"ON","enable_io_uring":"ON","enable_simd":"ON"}]}') }}

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            autoconf clang libbenchmark-dev \
            liburing-dev libbpf-dev

      - name: Install XTCP E2E diagnostics
        if: matrix.suffix == ''
        run: sudo apt-get install -y --no-install-recommends tcpdump

      # Built archives only. The Boost and OpenSSL source trees, plus the .o
      # files left behind by `make`, used to turn this into a ~600 MB entry.
      # Changing what is cached means bumping one of the version variables
      # above; actions/cache never overwrites an existing key.
      # One cache entry per dependency, so bumping one version leaves the other
      # two alone instead of rebuilding all three from source. Keys are
      # exact-match only on purpose: a restore-keys prefix hit restores the tree
      # but still reports cache-hit=false, so the build step reruns on top of
      # what was just restored.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/boost
          key: linux-amd64-boost${{ env.BOOST_VERSION }}

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/openssl
          key: linux-amd64-openssl${{ env.OPENSSL_VERSION }}

      - name: Cache jemalloc
        id: cache-jemalloc
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/jemalloc
          key: linux-amd64-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          # Idempotent: a restored cache or a re-run can leave third-party/boost
          # behind, and a bare `mv` into a non-empty directory fails. build-macos,
          # build-linux-cross and build-android already clear it first.
          rm -rf boost
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          touch /tmp/empty.c && cc -c /tmp/empty.c -o /tmp/empty.o && ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      - name: Build jemalloc
        if: steps.cache-jemalloc.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar jxf jemalloc-*.tar.bz2 && rm jemalloc-*.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc && ./autogen.sh --with-jemalloc-prefix=je_ && make -j$(nproc)

      # Trim each cached tree down to the headers and archives the link step
      # reads, so the cache stops carrying ~450 MB of source that any future miss
      # would refetch in seconds. third-party/xtcp and third-party/.cache are no
      # longer cached at all: prepare_xtcp.sh re-fetches its small checksummed
      # archive every run and is idempotent, which is cheaper than the hard
      # failure a stale xtcp tree restored from cache would cause.
      - name: Trim re-downloadable sources before caching
        run: |
          set -euo pipefail
          TP="${{ github.workspace }}/third-party"
          # Keep boost/boost (the include root CMake points at) and boost/stage.
          rm -rf "$TP/boost/libs" "$TP/boost/doc" "$TP/boost/tools" \
                 "$TP/boost/status" "$TP/boost/bin.v2"
          # include/openssl/*.h are symlinks into ../crypto and ../ssl, so the
          # .h files have to survive; only the .o files are disposable.
          rm -rf "$TP/openssl/fuzz" "$TP/openssl/test" "$TP/openssl/openssl"
          find "$TP/openssl" "$TP/jemalloc" -name '*.o' -delete
          rm -rf "$TP/jemalloc/autom4te.cache"

      - name: Compute version label
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2
        run: |
          bash tools/prepare_xtcp.sh
          TP="${{ github.workspace }}/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}" \
            -DENABLE_SYSNAT=${{ matrix.enable_sysnat }} \
            -DENABLE_IO_URING=${{ matrix.enable_io_uring }} \
            -DENABLE_SIMD=${{ matrix.enable_simd }}
          make -j$(nproc)

      - name: UDP benchmark correctness smoke
        if: matrix.suffix == ''
        run: |
          TP="${{ github.workspace }}/third-party"
          cmake -S bench -B build-bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPENPPP2_BOOST_INCLUDE_DIR="$TP/boost"
          cmake --build build-bench -j$(nproc)
          ctest --test-dir build-bench --output-on-failure -L correctness

      - name: Client/server Android-key compat smoke
        if: matrix.suffix == ''
        run: |
          sudo PPP_BIN="$PWD/bin/ppp" COMPAT_MODE=match \
            bash tools/client_server_compat_smoke.sh
          sudo PPP_BIN="$PWD/bin/ppp" COMPAT_MODE=mismatch \
            bash tools/client_server_compat_smoke.sh

      - name: Collect artifacts
        run: |
          ARTIFACT="openppp2-linux-amd64${{ matrix.suffix }}.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"

          # Copy binary
          cp bin/ppp "$ARTIFACT_DIR/"

          # Copy configuration files
          for f in appsettings.json cacert.pem cacert.sha256 \
                   dns-rules.txt firewall-rules.txt ip.txt \
                   cmcc.txt starrylink.net.key starrylink.net.pem; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          # Copy documentation
          for f in README.md README_CN.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          # Copy Linux driver / sysnat sources for downstream kernel module builds
          mkdir -p "$ARTIFACT_DIR/linux/ppp/tap"
          for f in linux/ppp/tap/TapLinux.cpp linux/ppp/tap/TapLinux.h \
                   linux/ppp/tap/openppp2_driver.skel.h \
                   linux/ppp/tap/openppp2_sysnat.c \
                   linux/ppp/tap/openppp2_sysnat.h; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/linux/ppp/tap/"; fi
          done

          # Package
          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v7
        with:
          name: openppp2-linux-amd64${{ matrix.suffix }}
          path: bin/openppp2-linux-amd64${{ matrix.suffix }}.zip
          if-no-files-found: error

      # ENABLE_XTCP defaults to ON for Linux desktop builds and "Build openppp2"
      # already prepares the pinned XTCP tree, so the packaged bin/ppp is the
      # XTCP-enabled binary under test; no separate rebuild is needed.
      - name: XTCP TAP netns end-to-end
        if: matrix.suffix == ''
        run: |
          sudo PPP_BIN="$PWD/bin/ppp" \
            OPENPPP2_NAMESPACE_ARTIFACT_DIR="$PWD/xtcp-e2e-artifacts" \
            bash tests/integration/linux/xtcp_tap_netns_e2e.sh

      - name: Upload XTCP E2E artifacts
        if: matrix.suffix == '' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: xtcp-e2e-artifacts
          path: xtcp-e2e-artifacts/
          if-no-files-found: ignore

  # ── Debian 10 (Buster) compatibility build ──────────────────────────
  # Ensures the binary runs on Debian 10 / glibc 2.28 / kernel 4.19+.
  # io_uring and SYSNAT are disabled (require kernel ≥ 5.10).
  build-debian10:
    name: Linux amd64 Debian 10
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container: debian:buster

    steps:
      - name: Install Git for checkout
        run: |
          # Debian 10 Buster reached EOL; switch to archive mirrors before checkout.
          sed -i 's|deb.debian.org/debian|archive.debian.org/debian|g' /etc/apt/sources.list
          sed -i 's|deb.debian.org/debian-security|archive.debian.org/debian-security|g' /etc/apt/sources.list
          sed -i '/buster-updates/d' /etc/apt/sources.list
          apt-get update -y
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential cmake zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            zlib1g-dev libzstd-dev \
            autoconf

      # One cache entry per dependency, so bumping one version leaves the other
      # two alone instead of rebuilding all three from source. Keys are
      # exact-match only on purpose: a restore-keys prefix hit restores the tree
      # but still reports cache-hit=false, so the build step reruns on top of
      # what was just restored.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/boost
          key: linux-amd64-debian10-boost${{ env.BOOST_VERSION }}

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/openssl
          key: linux-amd64-debian10-openssl${{ env.OPENSSL_VERSION }}

      - name: Cache jemalloc
        id: cache-jemalloc
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/jemalloc
          key: linux-amd64-debian10-jemalloc${{ env.JEMALLOC_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          # Idempotent: a restored cache or a re-run can leave third-party/boost
          # behind, and a bare `mv` into a non-empty directory fails.
          rm -rf boost
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          touch /tmp/empty.c && cc -c /tmp/empty.c -o /tmp/empty.o && ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      - name: Build jemalloc
        if: steps.cache-jemalloc.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://github.com/jemalloc/jemalloc/releases/download/${JEMALLOC_VERSION}/jemalloc-${JEMALLOC_VERSION}.tar.bz2"
          tar jxf jemalloc-*.tar.bz2 && rm jemalloc-*.tar.bz2
          mv jemalloc-* jemalloc
          cd jemalloc && ./autogen.sh --with-jemalloc-prefix=je_ && make -j$(nproc)

      # Trim each cached tree down to the headers and archives the link step
      # reads, so the cache stops carrying ~450 MB of source that any future miss
      # would refetch in seconds. Inside the Debian container the workspace
      # lives at $GITHUB_WORKSPACE, not at the host path ${{ github.workspace }}.
      - name: Trim re-downloadable sources before caching
        shell: bash
        run: |
          set -euo pipefail
          TP="$GITHUB_WORKSPACE/third-party"
          # Keep boost/boost (the include root CMake points at) and boost/stage.
          rm -rf "$TP/boost/libs" "$TP/boost/doc" "$TP/boost/tools" \
                 "$TP/boost/status" "$TP/boost/bin.v2"
          # include/openssl/*.h are symlinks into ../crypto and ../ssl, so the
          # .h files have to survive; only the .o files are disposable.
          rm -rf "$TP/openssl/fuzz" "$TP/openssl/test" "$TP/openssl/openssl"
          find "$TP/openssl" "$TP/jemalloc" -name '*.o' -delete
          rm -rf "$TP/jemalloc/autom4te.cache"

      - name: Compute version label
        id: ver
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2
        shell: bash
        run: |
          # Inside a Debian container $GITHUB_WORKSPACE maps to /__w/...
          # while ${{ github.workspace }} resolves to the host path.
          TP="$GITHUB_WORKSPACE/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}" \
            -DENABLE_SYSNAT=OFF \
            -DENABLE_IO_URING=OFF \
            -DENABLE_XTCP=OFF
          make -j$(nproc)

      - name: Collect artifacts
        shell: bash
        run: |
          ARTIFACT="openppp2-linux-amd64-debian10.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"

          cp bin/ppp "$ARTIFACT_DIR/"

          for f in appsettings.json cacert.pem cacert.sha256 \
                   dns-rules.txt firewall-rules.txt ip.txt \
                   cmcc.txt starrylink.net.key starrylink.net.pem; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          for f in README.md README_CN.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done

          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v7
        with:
          name: openppp2-linux-amd64-debian10
          path: bin/openppp2-linux-amd64-debian10.zip
          if-no-files-found: error

  # ── AddressSanitizer diagnostic build ──────────────────────────────
  # Diagnostic only (NOT for production). Builds with -DENABLE_ASAN=ON which
  # disables jemalloc so ASan's allocator interceptors are in effect, to
  # reproduce/pin down the vmux multi-link teardown heap corruption (issue #5).
  # jemalloc is intentionally NOT built here (the macro is off).
  build-asan:
    name: Linux amd64 ASan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git zip unzip curl wget \
            libkrb5-dev libicu-dev libssl-dev libunwind-dev \
            autoconf clang \
            liburing-dev libbpf-dev

      # One cache entry per dependency, so bumping one version leaves the other
      # alone instead of rebuilding both from source. Keys are exact-match only
      # on purpose: a restore-keys prefix hit restores the tree but still
      # reports cache-hit=false, so the build step reruns on top of what was
      # just restored.
      - name: Cache Boost
        id: cache-boost
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/boost
          key: linux-amd64-ubuntu24-asan-boost${{ env.BOOST_VERSION }}

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/third-party/openssl
          key: linux-amd64-ubuntu24-asan-openssl${{ env.OPENSSL_VERSION }}

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_VERSION//./_}.tar.bz2"
          tar jxf boost_*.tar.bz2 && rm boost_*.tar.bz2
          # Idempotent: a restored cache or a re-run can leave third-party/boost
          # behind, and a bare `mv` into a non-empty directory fails.
          rm -rf boost
          mv boost_* boost
          cd boost && ./bootstrap.sh && ./b2 cxxflags=-fPIC -j$(nproc)
          # Boost 1.89+ system is header-only; create empty archive for linker compatibility
          touch /tmp/empty.c && cc -c /tmp/empty.c -o /tmp/empty.o && ar rcs stage/lib/libboost_system.a /tmp/empty.o && rm -f /tmp/empty.c /tmp/empty.o

      - name: Build OpenSSL
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          mkdir -p third-party && cd third-party
          wget -q "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz"
          tar zxf openssl-*.tar.gz && rm openssl-*.tar.gz
          mv openssl-* openssl
          cd openssl && ./Configure && make -j$(nproc)

      # Trim each cached tree down to the headers and archives the link step
      # reads, so the cache stops carrying ~450 MB of source that any future miss
      # would refetch in seconds. jemalloc is not built here (ENABLE_ASAN=ON
      # turns it off), so only the Boost and OpenSSL trees are trimmed.
      - name: Trim re-downloadable sources before caching
        run: |
          set -euo pipefail
          TP="${{ github.workspace }}/third-party"
          # Keep boost/boost (the include root CMake points at) and boost/stage.
          rm -rf "$TP/boost/libs" "$TP/boost/doc" "$TP/boost/tools" \
                 "$TP/boost/status" "$TP/boost/bin.v2"
          # include/openssl/*.h are symlinks into ../crypto and ../ssl, so the
          # .h files have to survive; only the .o files are disposable.
          rm -rf "$TP/openssl/fuzz" "$TP/openssl/test" "$TP/openssl/openssl"
          find "$TP/openssl" -name '*.o' -delete

      - name: Compute version label
        id: ver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags --force 2>/dev/null || true
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo dev)
          SHA=$(git rev-parse --short=8 HEAD)
          echo "label=${TAG}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Build openppp2 (ASan)
        run: |
          TP="${{ github.workspace }}/third-party"
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTHIRD_PARTY_LIBRARY_DIR="$TP" \
            -DPPP_APPLICATION_VERSION="${{ steps.ver.outputs.label }}" \
            -DENABLE_ASAN=ON \
            -DENABLE_UBSAN=ON \
            -DENABLE_VMUX_CHURN_TEST=ON \
            -DENABLE_VMUX_RECEIVE_SEMANTICS_TEST=ON \
            -DENABLE_VMUX_FIN_DSN_TEST=ON \
            -DENABLE_SYSNAT=OFF \
            -DENABLE_IO_URING=OFF \
            -DENABLE_SIMD=OFF \
            -DENABLE_XTCP=OFF
          make -j$(nproc)

      - name: Run VMUX sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          bin/vmux_net_churn_integration_test
          bin/vmux_receive_semantics_test
          bin/vmux_fin_dsn_test

      - name: Collect ASan artifact
        run: |
          ARTIFACT="openppp2-linux-amd64-asan.zip"
          ARTIFACT_DIR="artifact"
          mkdir -p "$ARTIFACT_DIR"
          cp bin/ppp "$ARTIFACT_DIR/"
          for f in appsettings.json README.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" "$ARTIFACT_DIR/"; fi
          done
          cd "$ARTIFACT_DIR" && zip -r "../$ARTIFACT" .
          cd ..
          mv "$ARTIFACT" bin/

      - uses: actions/upload-artifact@v7
        with:
          name: openppp2-linux-amd64-asan
          path: bin/openppp2-linux-amd64-asan.zip
          if-no-files-found: error
